services:
  - type: web
    name: pulseiq-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableXsrfProtection false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: pulseiq-warehouse
          property: connectionString

databases:
  - name: pulseiq-warehouse
    databaseName: pulseiq
    user: pulseiq
    plan: free
