services:
  warehouse:
    image: postgres:16
    environment:
      POSTGRES_USER: ${WAREHOUSE_USER:-pulseiq}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-pulseiq}
      POSTGRES_DB: ${WAREHOUSE_DB:-pulseiq}
    ports:
      - "5433:5432"          # host port 5433, so it does not clash with a Postgres already on your PC
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      # Creates the tables on the very first start. The ETL also runs this file on every load.
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  etl:
    build: .
    depends_on:
      warehouse:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      RAW_DIR: /app/data/raw
      CLEAN_DIR: /app/data/clean
      REJECTED_DIR: /app/data/rejected
      LOG_DIR: /app/logs
      WAREHOUSE_DSN: postgresql://${WAREHOUSE_USER:-pulseiq}:${WAREHOUSE_PASSWORD:-pulseiq}@warehouse:5432/${WAREHOUSE_DB:-pulseiq}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./tests:/app/tests:ro
      - ./sql:/app/sql:ro
      - ./scripts:/app/scripts:ro

  superset:
    build:
      context: ./superset
      dockerfile: Dockerfile
    image: pulseiq-superset:3.1.3
    ports:
      - "8088:8088"
    depends_on:
      warehouse:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-pulseiq_superset_secret_key_32_chars_minimum_prod}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      SUPERSET_RO_USER: ${SUPERSET_RO_USER:-superset_ro}
      SUPERSET_RO_PASSWORD: ${SUPERSET_RO_PASSWORD:-superset_ro_pass}
      WAREHOUSE_HOST: warehouse
      WAREHOUSE_PORT: 5432
      WAREHOUSE_DB: ${WAREHOUSE_DB:-pulseiq}
    volumes:
      - superset_home:/app/superset_home
      - ./dashboards:/app/dashboards
      - ./sql:/app/sql:ro
      - ./scripts:/app/scripts:ro


volumes:
  warehouse_data:
  superset_home:

