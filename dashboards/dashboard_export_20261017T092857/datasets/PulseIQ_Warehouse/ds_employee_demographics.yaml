sql: "-- Dataset: Employee Demographics (Active Workforce)\n-- Used for: Tenure Bands\
  \ (Bar) and Role Mix (Bar).\nSELECT\n    e.employee_id,\n    e.full_name,\n    dep.department_id,\n\
  \    dep.department_name,\n    r.role_id,\n    r.role_title,\n    r.role_level,\n\
  \    e.gender,\n    e.work_mode,\n    e.work_location,\n    e.hire_date,\n    e.tenure_years,\n\
  \    CASE\n        WHEN e.tenure_years < 1 THEN 'Under 1 yr'\n        WHEN e.tenure_years\
  \ < 3 THEN '1-3 yrs'\n        WHEN e.tenure_years < 5 THEN '3-5 yrs'\n        WHEN\
  \ e.tenure_years < 10 THEN '5-10 yrs'\n        ELSE '10+ yrs'\n    END AS tenure_band,\n\
  \    CASE\n        WHEN e.tenure_years < 1 THEN 1\n        WHEN e.tenure_years <\
  \ 3 THEN 2\n        WHEN e.tenure_years < 5 THEN 3\n        WHEN e.tenure_years\
  \ < 10 THEN 4\n        ELSE 5\n    END AS tenure_band_order\nFROM dw.dim_employee\
  \ e\nJOIN dw.dim_department dep ON dep.department_key = e.department_key\nJOIN dw.dim_role\
  \ r ON r.role_key = e.role_key\nWHERE e.is_current = TRUE AND e.is_active = TRUE;\n"
