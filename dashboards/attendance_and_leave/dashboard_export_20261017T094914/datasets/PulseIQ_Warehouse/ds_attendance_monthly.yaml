sql: "-- Dataset: ds_attendance_monthly\n-- Used for attendance rate trends, rolling\
  \ metrics, and departmental comparisons\nSELECT \n    f.attendance_fact_id,\n  \
  \  f.employee_id,\n    f.date_key,\n    d.full_date AS month_end_date,\n    d.year,\n\
  \    d.month_number,\n    d.year_month,\n    dep.department_id,\n    dep.department_name,\n\
  \    f.scheduled_days,\n    f.present_days,\n    f.wfh_days,\n    f.half_days_unpaid,\n\
  \    f.paid_leave_days,\n    f.unpaid_absence_days,\n    f.late_arrivals,\n    f.avg_hours_worked,\n\
  \    f.overtime_hours,\n    f.attendance_rate\nFROM dw.fact_attendance_monthly f\n\
  JOIN dw.dim_date d ON d.date_key = f.date_key\nJOIN dw.dim_department dep ON dep.department_key\
  \ = f.department_key;\n"
