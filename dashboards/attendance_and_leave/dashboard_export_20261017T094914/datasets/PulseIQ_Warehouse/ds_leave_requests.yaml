sql: "-- Dataset: ds_leave_requests\n-- Used for leave distribution by type, weekday\
  \ patterns, and departmental breakdowns\nSELECT \n    f.leave_request_id,\n    f.employee_id,\n\
  \    f.employee_key,\n    e.full_name,\n    dep.department_id,\n    dep.department_name,\n\
  \    lt.leave_type_code,\n    lt.leave_type_name,\n    lt.pay_type,\n    f.start_date_key,\n\
  \    f.end_date_key,\n    sd.full_date AS start_date,\n    ed.full_date AS end_date,\n\
  \    sd.day_of_week AS start_day_of_week,\n    sd.year_month AS start_year_month,\n\
  \    sd.year AS start_year,\n    f.days,\n    f.calendar_days,\n    f.status,\n\
  \    f.approver_id,\n    f.reason\nFROM dw.fact_leave f\nJOIN dw.dim_leave_type\
  \ lt ON lt.leave_type_key = f.leave_type_key\nJOIN dw.dim_department dep ON dep.department_key\
  \ = f.department_key\nJOIN dw.dim_employee e ON e.employee_key = f.employee_key\n\
  JOIN dw.dim_date sd ON sd.date_key = f.start_date_key\nJOIN dw.dim_date ed ON ed.date_key\
  \ = f.end_date_key;\n"
