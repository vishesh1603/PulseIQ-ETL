sql: "-- Dataset: Headcount Monthly\n-- Used for: M01 Headcount KPI, M02 Joiners KPI,\
  \ M03 Leavers KPI, M04 Attrition Rate KPI,\n-- Headcount Trend (Line), Department\
  \ Split (Bar), and Joiners vs Leavers (Grouped Bars).\nSELECT\n    d.full_date AS\
  \ month_end,\n    d.year,\n    d.quarter,\n    d.month_number,\n    d.month_name,\n\
  \    d.year_month,\n    d.financial_year,\n    dep.department_id,\n    dep.department_name,\n\
  \    h.headcount_start,\n    h.hires AS joiners,\n    h.exits AS leavers,\n    h.voluntary_exits,\n\
  \    h.transfers_in,\n    h.transfers_out,\n    h.headcount_end,\n    h.attrition_rate_monthly_pct\n\
  FROM dw.fact_headcount_monthly h\nJOIN dw.dim_date d ON d.date_key = h.date_key\n\
  JOIN dw.dim_department dep ON dep.department_key = h.department_key;\n"
